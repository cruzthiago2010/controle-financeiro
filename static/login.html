<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Controle Financeiro</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b1020">
<style>
  :root{
    --bg:#0b1020; --card:#111827; --card2:#161f2e;
    --border:#232f42; --text:#e5e7eb; --muted:#94a3b8;
    --accent:#14b8a6; --accent2:#0d9488; --red:#ef4444;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:-apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background:
      radial-gradient(circle at 85% -8%, rgba(20,184,166,0.16), transparent 45%),
      radial-gradient(circle at 10% 110%, rgba(245,158,11,0.12), transparent 44%),
      var(--bg);
    color:var(--text); padding:20px;
  }
  .login-box{
    width:100%; max-width:360px; background:linear-gradient(160deg, var(--card), var(--card2));
    border:1px solid var(--border); border-radius:20px; padding:32px 26px;
    box-shadow:0 20px 60px rgba(0,0,0,0.4);
  }
  .logo{
    text-align:center; font-size:1.4rem; font-weight:800; margin-bottom:6px;
    background:linear-gradient(90deg, #fff, #7fe3d5); -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .subtitulo{text-align:center; color:var(--muted); font-size:0.85rem; margin-bottom:26px;}
  label{display:block; font-size:0.78rem; color:var(--muted); margin:14px 0 4px;}
  input{
    width:100%; background:var(--card2); color:var(--text); border:1px solid var(--border);
    border-radius:10px; padding:11px 12px; font-size:0.95rem; font-family:inherit;
  }
  input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(20,184,166,0.18);}
  button{
    width:100%; margin-top:22px; cursor:pointer; background:linear-gradient(135deg, var(--accent), var(--accent2));
    border:none; border-radius:10px; padding:12px; font-size:1rem; font-weight:700; color:#fff;
    box-shadow:0 4px 14px rgba(20,184,166,0.3);
  }
  button:disabled{opacity:0.6; cursor:default;}
  .erro{
    display:none; margin-top:14px; background:rgba(239,68,68,0.1); border:1px solid var(--red);
    color:var(--red); border-radius:8px; padding:10px 12px; font-size:0.85rem; text-align:center;
  }
  .erro.ativo{display:block;}
  .rodape{text-align:center; margin-top:18px; font-size:0.82rem; color:var(--muted);}
  .rodape a{color:var(--accent); text-decoration:none;}
  .divisor{display:flex; align-items:center; gap:10px; margin:20px 0; color:var(--muted); font-size:0.75rem;}
  .divisor::before, .divisor::after{content:""; flex:1; height:1px; background:var(--border);}
  .btn-google{
    width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
    background:#fff; color:#1f1f1f; border:1px solid var(--border); border-radius:10px;
    padding:11px; font-size:0.92rem; font-weight:600; cursor:pointer; text-decoration:none;
    box-shadow:none; margin-top:0;
  }
  .btn-google:hover{transform:translateY(-1px);}
  .btn-google svg{width:18px; height:18px; flex:none;}
</style>
<!-- Privacy-friendly analytics by Plausible -->
<script async src="https://analytics.danilashes.com.br/js/pa-a6nLK6VNC0QIFR2mNgXCV.js"></script>
<script>
  window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
  plausible.init()
</script>
</head>
<body>

<div class="login-box">
  <div class="logo">💰 Controle Financeiro</div>
  <div class="subtitulo">Entre com seu usuário e senha</div>
  <a class="btn-google" href="/api/auth/google/login">
    <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.5 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.5 29.6 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-2.1 14.1-5.6l-6.5-5.5C29.6 34.7 27 35.5 24 35.5c-5.3 0-9.7-3.3-11.3-8l-6.6 5.1C9.5 39.5 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.5l6.5 5.5C39.9 37 44 31 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
    Entrar com Google
  </a>
  <div class="divisor">ou</div>
  <form id="loginForm">
    <label>Usuário</label>
    <input type="text" id="username" autocomplete="username" required>
    <label>Senha</label>
    <input type="password" id="senha" autocomplete="current-password" required>
    <div class="erro" id="loginErro"></div>
    <button type="submit" id="loginBtn">Entrar</button>
  </form>
  <div class="rodape">Não tem conta? <a href="/registro">Criar minha casa</a></div>
</div>

<script>
fetch("/api/auth/google/status").then(r => r.json()).then(d => {
  if (!d.habilitado){
    document.querySelector(".btn-google").style.display = "none";
    document.querySelector(".divisor").style.display = "none";
  }
}).catch(() => {});
(() => {
  const erro = new URLSearchParams(window.location.search).get("erro");
  if (erro){
    const el = document.getElementById("loginErro");
    el.textContent = erro === "google_indisponivel"
      ? "Login com Google não está configurado nesse servidor."
      : "Não foi possível entrar com o Google. Tente de novo.";
    el.classList.add("ativo");
  }
})();
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const erroEl = document.getElementById("loginErro");
  const btn = document.getElementById("loginBtn");
  erroEl.classList.remove("ativo");
  btn.disabled = true;
  btn.textContent = "Entrando...";
  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        username: document.getElementById("username").value,
        senha: document.getElementById("senha").value,
      }),
    });
    if (!res.ok){
      const j = await res.json().catch(() => ({}));
      throw new Error(j.erro || "Não foi possível entrar");
    }
    window.location.href = "/";
  } catch (err) {
    erroEl.textContent = err.message;
    erroEl.classList.add("ativo");
    btn.disabled = false;
    btn.textContent = "Entrar";
  }
});
</script>
</body>
</html>
