version: 2
updates:
  # Dependências Python do backend (requirements.txt)
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "Dependências:"
    labels: [dependências]

  # Actions usadas nos workflows deste repositório
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "Dependências:"
    labels: [dependências]

  # Imagem base do Dockerfile (python:3.11-slim)
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "Dependências:"
    labels: [dependências]

  # App Android
  - package-ecosystem: gradle
    directory: "/android"
    schedule:
      interval: monthly
    commit-message:
      prefix: "Dependências:"
    labels: [dependências, android]
