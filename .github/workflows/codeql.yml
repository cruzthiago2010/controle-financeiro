name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Segunda-feira de manhã: pega alerta novo mesmo em semana sem commit.
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analisar ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v4

      - name: Inicializar o CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Analisar
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
