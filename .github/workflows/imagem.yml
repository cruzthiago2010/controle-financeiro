name: Imagem

# Publica a imagem pronta no GitHub Container Registry, para quem hospeda não
# precisar construir. No servidor de quem publica o build leva 15 segundos, mas
# num Raspberry Pi passa de vários minutos — e é justamente nessa máquina que o
# app costuma acabar.
#
# São duas arquiteturas de propósito: amd64 é o servidor comum, e arm64 é o
# Raspberry Pi e o Mac com chip da Apple. Publicar só amd64 deixaria de fora
# quem mais ganha com isto.

# As actions de terceiros vêm presas ao commit, não à etiqueta de versão. Uma
# etiqueta como "v4" é móvel: quem publica a action pode reapontá-la para outro
# commit a qualquer momento, e esse commit roda aqui com acesso ao GITHUB_TOKEN
# que publica a imagem. O CodeQL aponta isso, e com razão. O comentário ao lado
# de cada SHA é o que deixa o Dependabot continuar propondo as atualizações.

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  # Dois pushes seguidos no main não precisam construir arm64 duas vezes.
  group: imagem-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publicar:
    name: Construir e publicar
    runs-on: ubuntu-latest
    # O build de arm64 roda emulado por QEMU e é bem mais lento que o nativo.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - name: QEMU (para construir arm64 numa máquina amd64)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Entrar no registro
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Token da própria execução: não há segredo para cadastrar nem para
          # rodar atrás de. Quem der fork publica no próprio namespace.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decidir as etiquetas
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` acompanha o main, que é o mesmo que o install.sh já
          # entregava clonando e construindo — não é uma promessa nova de
          # estabilidade. Release ganha a etiqueta da versão, para quem
          # prefere fixar.
          #
          # NÃO usar type=semver aqui: ele exige três números (3.4.0) e as tags
          # deste projeto sempre tiveram dois (v3.0 … v3.4). Com semver o
          # metadata-action devolvia lista VAZIA de etiquetas e o buildx
          # recusava publicar com "tag is needed when pushing to registry" — foi
          # o que derrubou a publicação da v3.4. O `match` tira o "v" e entrega
          # 3.4, que é o que o README promete; o `ref` mantém também a tag
          # literal, para quem digitar :v3.4.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=main-,format=short,enable={{is_default_branch}}
            type=match,pattern=v(.*),group=1
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=FinanCerto
            org.opencontainers.image.description=Controle financeiro pessoal e familiar, self-hosted
            org.opencontainers.image.licenses=AGPL-3.0

      - name: Construir e enviar
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Sem cache, cada execução recompila as dependências emuladas do zero.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Conferir que a imagem publicada sobe e responde
        # O CI já testa a imagem construída localmente; isto aqui confere a que
        # de fato foi parar no registro, que é a que as pessoas vão baixar.
        run: |
          IMAGEM=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "Conferindo $IMAGEM"
          docker run -d --name financerto-publicada -p 8420:5000 \
            -e ADMIN_PASSWORD=senha-de-teste-do-ci \
            -e SECRET_KEY=chave-de-teste-do-ci-com-tamanho-suficiente \
            "$IMAGEM"
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8420/; then
              echo "A imagem publicada respondeu."
              exit 0
            fi
            sleep 2
          done
          echo "::error::A imagem publicada não respondeu em 60s."
          docker logs financerto-publicada
          exit 1

  limpar:
    name: Apagar etiquetas main-* antigas
    needs: publicar
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Guardar as 10 mais recentes, apagar o resto
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          ORG, PACOTE, MANTER = "financerto", "financerto-app", 10
          TOKEN = os.environ["GH_TOKEN"]

          def chamar(metodo, caminho):
              req = urllib.request.Request(
                  "https://api.github.com" + caminho, method=metodo,
                  headers={"Authorization": "Bearer " + TOKEN,
                           "Accept": "application/vnd.github+json"})
              try:
                  with urllib.request.urlopen(req) as r:
                      corpo = r.read()
                      return r.status, (json.loads(corpo) if corpo else None)
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")

          versoes, pagina = [], 1
          while True:
              st, lote = chamar("GET", "/orgs/%s/packages/container/%s/versions"
                                       "?per_page=100&page=%d" % (ORG, PACOTE, pagina))
              if st != 200:
                  print("::warning::Não consegui listar as versões (HTTP %s). "
                        "A limpeza não roda, mas a publicação está feita." % st)
                  raise SystemExit(0)
              if not lote:
                  break
              versoes += lote
              pagina += 1

          def etiquetas(v):
              return v.get("metadata", {}).get("container", {}).get("tags", []) or []

          # Só entram versões cujas etiquetas são TODAS main-*. Uma versão que
          # carregue também `latest` ou a etiqueta de uma release fica de fora —
          # e é o caso comum, porque uma release aponta para o mesmo manifesto do
          # main-<sha> daquele commit. As versões SEM etiqueta também ficam: são
          # os manifestos por arquitetura, e apagá-las quebraria a imagem inteira.
          alvo = [v for v in versoes
                  if etiquetas(v) and all(t.startswith("main-") for t in etiquetas(v))]
          alvo.sort(key=lambda v: v["created_at"], reverse=True)
          apagar = alvo[MANTER:]

          print("versões no pacote: %d | candidatas main-*: %d | apagando: %d"
                % (len(versoes), len(alvo), len(apagar)))
          if not apagar:
              print("Nada a fazer.")
              raise SystemExit(0)

          falhas = 0
          for v in apagar:
              st, corpo = chamar("DELETE", "/orgs/%s/packages/container/%s/versions/%s"
                                           % (ORG, PACOTE, v["id"]))
              if st in (204, 200):
                  print("  apagada %s (%s)" % (etiquetas(v), v["created_at"][:16]))
              else:
                  falhas += 1
                  print("::warning::Não consegui apagar %s: HTTP %s %s"
                        % (etiquetas(v), st, str(corpo)[:200]))

          if falhas:
              print("::warning::%d etiqueta(s) não puderam ser apagadas. Provavelmente "
                    "o GITHUB_TOKEN não tem permissão de apagar pacote na organização; "
                    "nesse caso a limpeza precisa de um token próprio, ou de ser feita "
                    "à mão de tempos em tempos." % falhas)
          PY
