version: "3.7"

services:
  controle-financeiro:
    build: .
    image: controle-financeiro:latest
    container_name: controle-financeiro
    restart: unless-stopped
    ports:
      - "8420:5000"
    volumes:
      - ./data:/data
    # Lê as variáveis do arquivo .env (copie o .env.example e preencha).
    # Sem o .env, ou com alguma variável em branco, o app usa valores padrão
    # sozinho — ver comentários no .env.example.
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SECRET_KEY: ${SECRET_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      BRAPI_TOKEN: ${BRAPI_TOKEN:-}
      # O compose lista as variaveis uma a uma, entao variavel nova no .env
      # precisa ser declarada aqui tambem, senao nao chega no container.
      APP_ANDROID_VERSAO: ${APP_ANDROID_VERSAO:-}
      APP_ANDROID_MINIMA: ${APP_ANDROID_MINIMA:-}
      APP_ANDROID_URL: ${APP_ANDROID_URL:-}
      APP_ANDROID_NOTAS: ${APP_ANDROID_NOTAS:-}
