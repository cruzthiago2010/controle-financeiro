version: "3.7"

services:
  controle-financeiro:
    build: .
    image: controle-financeiro:latest
    container_name: controle-financeiro
    restart: unless-stopped
    ports:
      - "8420:5000"
    volumes:
      - ./data:/data
    # Para escolher suas próprias credenciais do primeiro usuário, descomente
    # o bloco abaixo (as DUAS linhas: "environment:" e as variáveis).
    # Se deixar comentado, uma senha aleatória é gerada sozinha e aparece
    # no log (docker compose logs) no primeiro start.
    #
    # environment:
    #   ADMIN_USERNAME: admin
    #   ADMIN_PASSWORD: escolha-uma-senha-forte
    #   # Opcional: chave de sessão fixa (32+ caracteres aleatórios).
    #   # Se não definir, é gerada automaticamente em data/.secret_key.
    #   SECRET_KEY: cole-aqui-uma-chave-aleatoria-longa
